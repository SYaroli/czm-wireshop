<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CZM • Bench Stock</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
  .page-wrap{max-width:1300px;margin:20px auto;padding:0 16px}
  .card-head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .card-title{margin:0;font-size:1.15rem;font-weight:900}
  .toolbar .search{min-width:260px;flex:1}
  .admin-panel{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-sizing:border-box;padding:20px;border:1px solid #cfd6df;border-radius:14px;background:#fafbfc;overflow:auto;color:#111827}
  .admin-panel::backdrop{background:rgba(0,0,0,.45)}
  .editor-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
  .editor-head h2{margin:0;font-size:1.15rem}
  .editor-actions{display:flex;gap:10px}
  body:has(#adminPanel[open]){overflow:hidden}
  .form-grid{display:grid;grid-template-columns:1.3fr 2fr 1.2fr 1.2fr .8fr auto;gap:10px;align-items:end}
  .field label{display:block;font-size:.82rem;font-weight:800;color:#555;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border:1px solid #cfd6df;border-radius:10px;font:inherit;box-sizing:border-box}
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .wide{grid-column:span 2}
  .form-grid{grid-template-columns:1fr}
  .form-grid .wide{grid-column:span 1}
  .toolbar .search{min-width:0;width:100%}
  .notes-cell{max-width:260px;white-space:normal;color:#4b5563;font-size:.88rem}
</style>
</head>
<body>
  <div class="brand-bar">
    <div class="brand-inner">
      <a class="brand-logo" href="/dashboard.html">
        <img src="/czm-logo.png" alt="CZM">
        <h1 class="brand-title">CZM • Bench Stock</h1>
      </a>
      <div class="brand-actions">
        <a class="navbtn" href="/dashboard.html">Dashboard</a>
        <a class="navbtn" href="/assignments.html">Build Next</a>
        <a class="navbtn" href="/inventory-list.html">Inventory</a>
        <a class="navbtn" href="/komax-files.html">Komax Files</a>
        <a class="navbtn active" href="/bench-stock.html">Bench Stock</a>
        <a class="navbtn" href="/admin.html">Admin</a>
        <button id="logoutBtn" class="navbtn">Logout</button>
      </div>
    </div>
  </div>

  <main class="page-wrap">
    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Bench Stock Inventory</h2>
        <div class="toolbar">
          <input id="searchBox" class="search" type="text" placeholder="Search part number, description, location, manufacturer" />
          <button id="toggleAdminBtn" class="btn hidden" type="button">Add Item</button>
          <button id="exportBtn" class="btn secondary" type="button">Export CSV</button>
        </div>
      </div>

      <dialog id="adminPanel" class="admin-panel" aria-labelledby="editorTitle">
        <div class="editor-head"><h2 id="editorTitle">Add Bench Stock Item</h2><button id="closeEditorBtn" class="small-btn" type="button" aria-label="Close editor">Close</button></div>
        <div class="form-grid">
          <div class="field">
            <label for="partNumber">Part Number</label>
            <input id="partNumber" type="text" />
          </div>
          <div class="field wide">
            <label for="description">Description</label>
            <input id="description" type="text" />
          </div>
          <div class="field">
            <label for="location">Location</label>
            <input id="location" type="text" />
          </div>
          <div class="field">
            <label for="manufacturer">Manufacturer</label>
            <input id="manufacturer" type="text" />
          </div>
          <div class="field">
            <label for="unitCost">Unit Cost (USD)</label>
            <input id="unitCost" type="number" min="0" step="any" placeholder="Leave blank if unknown" />
          </div>
          <div class="field">
            <label for="costUnit">Cost Unit</label>
            <select id="costUnit"><option value="ea">Each</option><option value="ft">Foot</option></select>
          </div>
          <div class="field">
            <label for="partPhoto">Part Photo</label>
            <input id="partPhoto" type="file" accept="image/jpeg,image/png,image/webp" />
            <small>JPG, PNG or WebP, up to 1 MB</small>
            <label id="removePhotoLabel" hidden><input id="removePhoto" type="checkbox" /> Remove current photo</label>
          </div>
          <div class="field wide">
            <label for="notes">Notes</label>
            <input id="notes" type="text" placeholder="Optional notes" />
          </div>
          <div class="field">
            <div class="editor-actions"><button id="saveBtn" class="btn" type="button">Save</button><button id="cancelEditorBtn" class="btn secondary" type="button">Cancel</button></div>
          </div>
        </div>
        <p id="formStatus" role="status" class="muted" style="margin:10px 0 0 0;"></p>
      </dialog>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Photo</th>
              <th>Part Number</th>
              <th>Description</th>
              <th>Location</th>
              <th>Manufacturer</th>
              <th>Unit Cost</th>
              <th>Notes</th>
              <th>Updated</th>
              <th>By</th>
              <th id="actionsHead" class="hidden">Actions</th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <tr><td colspan="10" class="muted">Loading bench stock...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_ROOT = 'https://wireshop-backend.onrender.com';
    const user = (() => { try { return JSON.parse(localStorage.getItem('user') || '{}'); } catch { return {}; } })();
    if (!user || !user.username) window.location.href = '/index.html';

    const itemsBody = document.getElementById('itemsBody');
    const searchBox = document.getElementById('searchBox');
    const adminPanel = document.getElementById('adminPanel');
    const toggleAdminBtn = document.getElementById('toggleAdminBtn');
    const actionsHead = document.getElementById('actionsHead');
    const formStatus = document.getElementById('formStatus');
    const fields = {
      partNumber: document.getElementById('partNumber'),
      description: document.getElementById('description'),
      location: document.getElementById('location'),
      manufacturer: document.getElementById('manufacturer'),
      unitCost: document.getElementById('unitCost'),
      costUnit: document.getElementById('costUnit'),
      notes: document.getElementById('notes'),
    };

    const partPhoto = document.getElementById('partPhoto');
    const removePhoto = document.getElementById('removePhoto');
    const removePhotoLabel = document.getElementById('removePhotoLabel');
    const photoObserver = new IntersectionObserver(entries => {
      for (const { target, isIntersecting } of entries) {
        if (!isIntersecting) continue;
        photoObserver.unobserve(target);
        loadPhoto(target);
      }
    });

    async function loadPhoto(img){
      try {
        const path = '/api/benchstock/' + encodeURIComponent(img.dataset.photo) + '/photo';
        const res = await fetch(API_ROOT + path, { headers: { 'x-user': user.username } });
        if (!res.ok) throw new Error('Photo unavailable');
        const blob = await res.blob();
        if (!img.isConnected) return;
        const url = URL.createObjectURL(blob);
        img.addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
        img.addEventListener('error', () => URL.revokeObjectURL(url), { once: true });
        img.src = url;
      } catch {
        img.replaceWith(document.createTextNode('Photo unavailable'));
      }
    }

    function readPhoto(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read the photo.'));
        reader.readAsDataURL(file);
      });
    }

    let isAdmin = String(user.role || '').toLowerCase() === 'admin';
    let allRows = [];
    let editingPart = null;
    let editorScroll = { left: 0, top: 0 };
    let editorTrigger = null;
    let saving = false;

    function openEditor(title){
      editorScroll = { left: window.scrollX, top: window.scrollY };
      editorTrigger = document.activeElement;
      document.getElementById('editorTitle').textContent = title;
      adminPanel.scrollTop = 0;
      adminPanel.showModal();
      fields.partNumber.focus({ preventScroll: true });
    }

    function closeEditor(){
      if (saving) return;
      adminPanel.close();
    }

    adminPanel.addEventListener('cancel', e => {
      if (saving) e.preventDefault();
    });
    adminPanel.addEventListener('close', () => {
      clearForm();
      editorTrigger?.isConnected && editorTrigger.focus({ preventScroll: true });
      window.scrollTo({ ...editorScroll, behavior: 'instant' });
    });
    document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
    document.getElementById('cancelEditorBtn').addEventListener('click', closeEditor);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user');
      location.href = '/index.html';
    });

    function esc(value){
      return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function setStatus(message, ok = false){
      formStatus.textContent = message || '';
      formStatus.style.color = !message ? '#6b7280' : (ok ? '#15803d' : '#b91c1c');
    }

    async function api(path, opts = {}){
      const res = await fetch(API_ROOT + path, {
        method: opts.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          'x-user': user.username,
        },
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });

      if (!res.ok) {
        let msg = 'Request failed';
        try {
          const data = await res.json();
          msg = data.error || JSON.stringify(data);
        } catch {
          msg = await res.text();
        }
        throw new Error(msg || 'Request failed');
      }

      if (res.status === 204) return null;
      return res.json();
    }

    async function whoami(){
      try {
        const me = await api('/api/auth/me');
        isAdmin = !!me.isAdmin;
      } catch (_) {}

      toggleAdminBtn.classList.toggle('hidden', !isAdmin);
      actionsHead.classList.toggle('hidden', !isAdmin);
    }

    function clearForm(){
      editingPart = null;
      partPhoto.value = '';
      removePhoto.checked = false;
      removePhotoLabel.hidden = true;
      fields.partNumber.value = '';
      fields.description.value = '';
      fields.location.value = '';
      fields.manufacturer.value = '';
      fields.unitCost.value = '';
      fields.costUnit.value = 'ea';
      fields.notes.value = '';
      document.getElementById('saveBtn').textContent = 'Save';
      setStatus('');
    }

    function fillForm(row){
      editingPart = row.partNumber;
      partPhoto.value = '';
      removePhoto.checked = false;
      removePhotoLabel.hidden = !row.hasPhoto;
      fields.partNumber.value = row.partNumber || '';
      fields.description.value = row.description || '';
      fields.location.value = row.location || '';
      fields.manufacturer.value = row.manufacturer || '';
      fields.unitCost.value = row.unitCost ?? '';
      fields.costUnit.value = row.costUnit ?? 'ea';
      fields.notes.value = row.notes || '';
      document.getElementById('saveBtn').textContent = 'Update';
      setStatus(`Editing ${row.partNumber}`);
      openEditor('Edit Bench Stock Item');
    }

    function filteredRows(){
      const q = String(searchBox.value || '').trim().toLowerCase();
      if (!q) return allRows;
      return allRows.filter(r => [r.partNumber, r.description, r.location, r.manufacturer]
        .some(v => String(v || '').toLowerCase().includes(q)));
    }

    function render(){
      const rows = filteredRows();
      photoObserver.disconnect();
      if (!rows.length) {
        itemsBody.innerHTML = `<tr><td colspan="10" class="muted">No bench stock items found.</td></tr>`;
        return;
      }

      itemsBody.innerHTML = rows.map(r => `
        <tr data-part="${esc(r.partNumber)}">
          <td>${r.hasPhoto ? `<img data-photo="${esc(r.partNumber)}" width="64" height="64" style="object-fit:contain" alt="Part ${esc(r.partNumber)}" />` : ''}</td>
          <td><strong>${esc(r.partNumber)}</strong></td>
          <td>${esc(r.description)}</td>
          <td>${esc(r.location)}</td>
          <td>${esc(r.manufacturer)}</td>
          <td>${r.unitCost == null ? '' : esc('$' + r.unitCost + '/' + (r.costUnit ?? 'ea'))}</td>
          <td class="notes-cell">${esc(r.notes)}</td>
          <td>${r.updatedAt ? esc(new Date(r.updatedAt).toLocaleString()) : ''}</td>
          <td>${esc(r.updatedBy)}</td>
          <td class="actions ${isAdmin ? '' : 'hidden'}">
            <button class="small-btn js-edit" type="button">Edit</button>
            <button class="small-btn delete js-delete" type="button">Delete</button>
          </td>
        </tr>
      `).join('');
      itemsBody.querySelectorAll('[data-photo]').forEach(img => photoObserver.observe(img));
    }

    async function loadRows(){
      try {
        allRows = (await api('/api/benchstock-all')).sort((a, b) =>
          String(a.partNumber || '').localeCompare(String(b.partNumber || ''), undefined, {
            numeric: true,
            sensitivity: 'base'
          })
        );
        render();
      } catch (err) {
        console.error(err);
        itemsBody.innerHTML = `<tr><td colspan="10" class="muted">Failed to load bench stock.</td></tr>`;
      }
    }

    async function saveRow(){
      if (saving) return;
      const payload = {
        partNumber: fields.partNumber.value.trim(),
        description: fields.description.value.trim(),
        location: fields.location.value.trim(),
        manufacturer: fields.manufacturer.value.trim(),
        unitCost: fields.unitCost.value === '' ? null : fields.unitCost.valueAsNumber,
        costUnit: fields.costUnit.value,
        notes: fields.notes.value.trim(),
      };

      if (!payload.partNumber) return setStatus('Part number is required.');

      if (!fields.unitCost.validity.valid || (payload.unitCost !== null && !Number.isFinite(payload.unitCost))) return setStatus('Unit cost must be 0 or higher.');

      const targetPart = editingPart;
      const file = partPhoto.files[0];
      if (file && (file.size > 1024 * 1024 || !['image/jpeg','image/png','image/webp'].includes(file.type))) {
        return setStatus('Upload a JPG, PNG or WebP image up to 1 MB.');
      }
      if (file && removePhoto.checked) return setStatus('Choose either a replacement photo or removal.');

      saving = true;
      const editorButtons = adminPanel.querySelectorAll('button');
      editorButtons.forEach(button => button.disabled = true);
      try {
        if (file) payload.photo = await readPhoto(file);
        else if (removePhoto.checked) payload.photo = null;
        if (targetPart) {
          await api(`/api/benchstock/${encodeURIComponent(targetPart)}`, { method: 'PUT', body: payload });
          setStatus('Bench stock item updated.', true);
        } else {
          await api('/api/benchstock', { method: 'POST', body: payload });
          setStatus('Bench stock item added.', true);
        }
        await loadRows();
        const savedRow = Array.from(itemsBody.querySelectorAll('tr[data-part]')).find(row => row.dataset.part === payload.partNumber);
        editorTrigger = savedRow?.querySelector('.js-edit') || toggleAdminBtn;
        saving = false;
        closeEditor();
      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Failed to save item.');
      } finally {
        saving = false;
        editorButtons.forEach(button => button.disabled = false);
      }
    }

    function exportCsv(){
      const rows = filteredRows();
      const header = ['Part Number','Description','Location','Manufacturer','Unit Cost (USD)','Cost Unit','Notes','Updated','By'];
      const lines = [header.join(',')].concat(rows.map(r => [
        r.partNumber,
        r.description,
        r.location,
        r.manufacturer,
        r.unitCost,
        r.costUnit ?? 'ea',
        r.notes || '',
        r.updatedAt ? new Date(r.updatedAt).toLocaleString() : '',
        r.updatedBy || '',
      ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')));

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bench-stock.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    toggleAdminBtn.addEventListener('click', () => {
      clearForm();
      openEditor('Add Bench Stock Item');
    });

    document.getElementById('saveBtn').addEventListener('click', saveRow);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    searchBox.addEventListener('input', render);

    itemsBody.addEventListener('click', async (e) => {
      const tr = e.target.closest('tr[data-part]');
      if (!tr) return;
      const part = tr.dataset.part;
      const row = allRows.find(x => x.partNumber === part);
      if (!row) return;

      if (e.target.classList.contains('js-edit')) {
        fillForm(row);
      }

      if (e.target.classList.contains('js-delete')) {
        if (!confirm(`Delete bench stock item ${part}?`)) return;
        try {
          await api(`/api/benchstock/${encodeURIComponent(part)}`, { method: 'DELETE' });
          if (editingPart === part) clearForm();
          await loadRows();
        } catch (err) {
          console.error(err);
          alert(err.message || 'Failed to delete item.');
        }
      }
    });

    (async function init(){
      await whoami();
      await loadRows();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CZM • Inventory Movement</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .toolbar label{display:flex;flex-direction:column;gap:4px;min-width:160px}
    .statline{margin-top:8px;font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
    .movement-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .selection-note{font-size:12px}.movement-table{width:100%;border-collapse:collapse}
    .movement-table th,.movement-table td{border:1px solid #d6d6d6;padding:7px 8px;vertical-align:middle}
    .movement-table thead th{background:#f1f1f1;font-weight:700;position:sticky;top:0;z-index:2;white-space:nowrap}
    .movement-table tbody tr:nth-child(even) td{background:#fafafa}.movement-table tbody tr.row-selected td{background:#eef5ff}
    .movement-table td.note{white-space:normal;min-width:220px}.movement-table td.actions{white-space:nowrap}.movement-table .select-cell{width:34px;text-align:center}
    .empty,.error{padding:14px 6px;font-size:13px}.error{color:#b30000}button.small{padding:5px 8px;font-size:12px}button.danger{background:#9f1c1c;color:#fff;border-color:#9f1c1c}button:disabled{opacity:.45;cursor:not-allowed}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}.modal-backdrop.open{display:flex}
    .modal{width:min(620px,100%);background:#fff;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.28);padding:18px}.modal h2{margin:0 0 14px}
    .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.modal-grid label{display:flex;flex-direction:column;gap:4px}.modal-grid .full{grid-column:1/-1}.readonly{background:#f3f3f3}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.history-warning{margin-top:12px;padding:9px 10px;background:#fff5d9;border:1px solid #ead69b;border-radius:6px;font-size:12px}
    @media(max-width:760px){.modal-grid{grid-template-columns:1fr}.modal-grid .full{grid-column:auto}}
  </style>
</head>
<body>
  <div class="brand-bar"><div class="brand-inner">
    <a class="brand-logo" href="/dashboard.html"><img src="/czm-logo.png" alt="CZM"><h1 class="brand-title">CZM • Inventory Movement</h1></a>
    <div class="brand-actions"><a class="navbtn" href="/assignments.html">Assignments</a><a class="navbtn" href="/inventory.html">Inventory</a><a class="navbtn" href="/komax-files.html">Komax Files</a><a class="navbtn active" href="/admin.html">Admin</a><button id="logoutBtn" class="navbtn">Logout</button></div>
  </div></div>

  <main>
    <div class="card">
      <div class="toolbar">
        <label><span class="muted">Search part / description / user / note</span><input id="searchBox" type="text" placeholder="48002, shane, removed, mast..." /></label>
        <label><span class="muted">Direction</span><select id="dirFilter"><option value="all">All</option><option value="in">In only</option><option value="out">Out only</option><option value="same">No qty change</option></select></label>
        <label><span class="muted">Rows</span><select id="limitSel"><option value="250">250</option><option value="500" selected>500</option><option value="1000">1000</option><option value="2000">2000</option><option value="all">All</option></select></label>
        <button id="refreshBtn" type="button">Refresh</button><button id="exportBtn" class="secondary" type="button">Export CSV</button>
      </div>
      <div id="stats" class="statline muted"></div>
      <div class="movement-actions"><button id="combineBtn" type="button" disabled>Combine Selected</button><button id="deleteSelectedBtn" class="danger" type="button" disabled>Delete Selected</button><span id="selectionNote" class="selection-note muted">No rows selected.</span></div>
    </div>

    <div class="card"><div class="table-wrap"><table class="movement-table">
      <thead><tr><th class="select-cell"><input id="selectAll" type="checkbox" title="Select all visible rows"></th><th>Time</th><th>Part</th><th>Description</th><th>User</th><th>Direction</th><th>Qty</th><th>Before</th><th>After</th><th>Note</th><th>Actions</th></tr></thead>
      <tbody id="movementBody"><tr><td colspan="11" class="empty">Loading…</td></tr></tbody>
    </table></div></div>
  </main>

  <div id="editBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal">
    <h2 id="editTitle">Edit Inventory Movement</h2>
    <div class="modal-grid">
      <label><span class="muted">Time</span><input id="editTime" class="readonly" readonly></label><label><span class="muted">User</span><input id="editUser" class="readonly" readonly></label>
      <label><span class="muted">Part Number</span><input id="editPart" class="readonly" readonly></label><label><span class="muted">Description</span><input id="editDescription" class="readonly" readonly></label>
      <label><span class="muted">Movement</span><select id="editDirection"><option value="in">In</option><option value="out">Out</option><option value="same">No Change</option></select></label>
      <label><span class="muted">Quantity</span><input id="editQty" type="number" min="0" step="1"></label>
      <label><span class="muted">Before</span><input id="editBefore" class="readonly" readonly></label><label><span class="muted">After</span><input id="editAfter" class="readonly" readonly></label>
      <label class="full"><span class="muted">Note</span><textarea id="editNote" rows="3"></textarea></label>
    </div>
    <div class="history-warning"><b>History cleanup only:</b> editing or deleting a movement here does not change the part's current inventory quantity.</div>
    <div id="editError" class="error" style="display:none"></div>
    <div class="modal-actions"><button id="cancelEditBtn" class="secondary" type="button">Cancel</button><button id="saveEditBtn" type="button">Save Changes</button></div>
  </div></div>

  <script>
    const API_BASE=(localStorage.getItem("API_BASE")||"https://wireshop-backend.onrender.com").replace(/\/+$/,'');
    const MOVEMENT_API=API_BASE+"/api/inventory-log",INVENTORY_API=API_BASE+"/api/inventory-all";
    let rawRows=[],visibleRows=[],inventoryMap=new Map(),selectedIds=new Set(),editingId=null;
    function getSession(){try{return JSON.parse(localStorage.getItem("user")||"{}")}catch{return {}}}
    function requireAdmin(){const s=getSession();if(!s.username){location.replace("index.html");return false}if(String(s.role||'').toLowerCase()!=="admin"){location.replace("assignments.html");return false}return true}
    function authHeaders(){return {"Content-Type":"application/json","x-user":getSession().username}}
    function logout(){localStorage.removeItem("user");location.replace("index.html")}
    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function pad2(n){return String(n).padStart(2,'0')}
    function formatTs(ts){if(!ts)return '';const d=new Date(Number(ts));if(Number.isNaN(d.getTime()))return String(ts);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`}
    function classify(delta){const n=Number(delta||0);return n>0?'in':n<0?'out':'same'}
    function directionChip(delta){const d=classify(delta);return d==='in'?'<span class="chip in">In</span>':d==='out'?'<span class="chip out">Out</span>':'<span class="chip same">No Change</span>'}
    function quantityLabel(delta){return Math.abs(Number(delta||0))}
    function csvEscape(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
    async function apiJson(url,options={}){const res=await fetch(url,{...options,headers:{...authHeaders(),...(options.headers||{})}});let data=null;try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.error||`Request failed (${res.status})`);return data}
    function decoratedRows(){return rawRows.map(r=>{const inv=inventoryMap.get(String(r.partNumber||'').toLowerCase())||{};return {...r,description:inv.description||'',location:inv.location||''}})}
    function filteredRows(){const search=(searchBox.value||'').trim().toLowerCase(),dir=dirFilter.value;let rows=decoratedRows();if(dir!=='all')rows=rows.filter(r=>classify(r.delta)===dir);if(search)rows=rows.filter(r=>[r.partNumber,r.description,r.location,r.user,r.note,r.before,r.after,r.delta].join(' ').toLowerCase().includes(search));return rows}
    function updateSelectionControls(){const rows=rawRows.filter(r=>selectedIds.has(Number(r.id))),parts=new Set(rows.map(r=>String(r.partNumber||'').toLowerCase())),samePart=rows.length>=2&&parts.size===1;combineBtn.disabled=!samePart;deleteSelectedBtn.disabled=!rows.length;let text=rows.length?`${rows.length} row${rows.length===1?'':'s'} selected.`:'No rows selected.';if(rows.length>=2&&!samePart)text+=' Combine requires the same part number.';selectionNote.textContent=text;const ids=visibleRows.map(r=>Number(r.id)),checked=ids.filter(id=>selectedIds.has(id)).length;selectAll.checked=ids.length>0&&checked===ids.length;selectAll.indeterminate=checked>0&&checked<ids.length}
    function renderRows(){visibleRows=filteredRows();const totalIn=visibleRows.reduce((s,r)=>s+Math.max(0,Number(r.delta||0)),0),totalOut=visibleRows.reduce((s,r)=>s+Math.abs(Math.min(0,Number(r.delta||0))),0);stats.innerHTML=`<span><b>${visibleRows.length}</b> rows shown</span><span><b>${totalIn}</b> in</span><span><b>${totalOut}</b> out</span>`;if(!visibleRows.length){movementBody.innerHTML='<tr><td colspan="11" class="empty">No movement found for that filter.</td></tr>';updateSelectionControls();return}movementBody.innerHTML=visibleRows.map(r=>{const id=Number(r.id),selected=selectedIds.has(id);return `<tr class="${selected?'row-selected':''}" data-id="${id}"><td class="select-cell"><input class="row-select" type="checkbox" data-id="${id}" ${selected?'checked':''}></td><td>${escapeHtml(formatTs(r.when||r.ts)||'—')}</td><td>${escapeHtml(r.partNumber)}</td><td>${escapeHtml(r.description||'—')}</td><td>${escapeHtml(r.user||'—')}</td><td>${directionChip(r.delta)}</td><td>${escapeHtml(quantityLabel(r.delta))}</td><td>${escapeHtml(r.before)}</td><td>${escapeHtml(r.after)}</td><td class="note">${escapeHtml(r.note||'')}</td><td class="actions"><button class="small edit-row" type="button" data-id="${id}">Edit</button> <button class="small danger delete-row" type="button" data-id="${id}">Delete</button></td></tr>`}).join('');updateSelectionControls()}
    async function loadInventoryMap(){try{const items=await apiJson(INVENTORY_API);inventoryMap=new Map((items||[]).map(i=>[String(i.partNumber||'').toLowerCase(),i]))}catch(err){console.warn('Inventory map load failed',err)}}
    async function loadMovement(){movementBody.innerHTML='<tr><td colspan="11" class="empty">Loading…</td></tr>';try{const v=String(limitSel.value||'500'),url=v==='all'?MOVEMENT_API:`${MOVEMENT_API}?limit=${encodeURIComponent(Number(v))}`;const [,rows]=await Promise.all([loadInventoryMap(),apiJson(url)]);rawRows=rows||[];selectedIds=new Set();renderRows()}catch(err){console.error(err);movementBody.innerHTML='<tr><td colspan="11" class="error">'+escapeHtml(err.message||'Failed to load movement.')+'</td></tr>'}}
    function rowById(id){const base=rawRows.find(r=>Number(r.id)===Number(id));if(!base)return null;const inv=inventoryMap.get(String(base.partNumber||'').toLowerCase())||{};return {...base,description:inv.description||''}}
    function updateEditAfter(){const before=Number(editBefore.value||0),qty=Math.max(0,Math.trunc(Number(editQty.value||0))),dir=editDirection.value,delta=dir==='in'?qty:dir==='out'?-qty:0;editAfter.value=before+delta;editQty.disabled=dir==='same'}
    function openEdit(id){const r=rowById(id);if(!r)return;editingId=Number(id);editTime.value=formatTs(r.when||r.ts);editUser.value=r.user||'';editPart.value=r.partNumber||'';editDescription.value=r.description||'';editDirection.value=classify(r.delta);editQty.value=quantityLabel(r.delta);editBefore.value=Number(r.before||0);editAfter.value=Number(r.after||0);editNote.value=r.note||'';editError.style.display='none';updateEditAfter();editBackdrop.classList.add('open')}
    function closeEdit(){editingId=null;editBackdrop.classList.remove('open')}
    async function saveEdit(){if(editingId==null)return;const dir=editDirection.value,raw=Number(editQty.value),qty=dir==='same'?0:Math.trunc(raw);editError.style.display='none';if(!Number.isFinite(qty)||qty<0){editError.textContent='Quantity must be zero or greater.';editError.style.display='block';return}const delta=dir==='in'?qty:dir==='out'?-qty:0;if(Number(editBefore.value||0)+delta<0){editError.textContent='That movement would make the After quantity negative.';editError.style.display='block';return}try{saveEditBtn.disabled=true;await apiJson(`${MOVEMENT_API}/${editingId}`,{method:'PUT',body:JSON.stringify({delta,note:editNote.value||''})});closeEdit();await loadMovement()}catch(err){editError.textContent=err.message;editError.style.display='block'}finally{saveEditBtn.disabled=false}}
    async function deleteOne(id){const r=rowById(id);if(!r)return;if(!confirm(`Delete this movement for ${r.partNumber}?\n\nThis removes the history row only. Current inventory quantity will not change.`))return;try{await apiJson(`${MOVEMENT_API}/${id}`,{method:'DELETE'});await loadMovement()}catch(err){alert(err.message)}}
    async function deleteSelected(){const ids=Array.from(selectedIds);if(!ids.length)return;if(!confirm(`Delete ${ids.length} selected movement${ids.length===1?'':'s'}?\n\nCurrent inventory quantities will not change.`))return;try{await apiJson(`${MOVEMENT_API}/delete-many`,{method:'POST',body:JSON.stringify({ids})});await loadMovement()}catch(err){alert(err.message)}}
    async function combineSelected(){const rows=rawRows.filter(r=>selectedIds.has(Number(r.id))),parts=new Set(rows.map(r=>String(r.partNumber||'').toLowerCase()));if(rows.length<2||parts.size!==1)return;const part=rows[0].partNumber,net=rows.reduce((s,r)=>s+(Number(r.delta)||0),0);if(!confirm(`Combine ${rows.length} movements for ${part} into one net movement (${net>=0?'+':''}${net})?\n\nThe earliest selected row keeps its original time and user.`))return;try{await apiJson(`${MOVEMENT_API}/combine`,{method:'POST',body:JSON.stringify({ids:rows.map(r=>Number(r.id))})});await loadMovement()}catch(err){alert(err.message)}}
    function exportCsv(){const rows=filteredRows().map(r=>({time:formatTs(r.when||r.ts),partNumber:r.partNumber||'',description:r.description||'',user:r.user||'',direction:classify(r.delta),qty:quantityLabel(r.delta),delta:Number(r.delta||0),before:Number(r.before||0),after:Number(r.after||0),note:r.note||''})),lines=[["Time","Part Number","Description","User","Direction","Qty","Delta","Before","After","Note"].join(',')];rows.forEach(r=>lines.push([r.time,r.partNumber,r.description,r.user,r.direction,r.qty,r.delta,r.before,r.after,r.note].map(csvEscape).join(',')));const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='inventory-movement.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
    movementBody.addEventListener('change',e=>{const box=e.target.closest('.row-select');if(!box)return;const id=Number(box.dataset.id);box.checked?selectedIds.add(id):selectedIds.delete(id);renderRows()});
    movementBody.addEventListener('click',e=>{const edit=e.target.closest('.edit-row');if(edit)return openEdit(Number(edit.dataset.id));const del=e.target.closest('.delete-row');if(del)return deleteOne(Number(del.dataset.id))});
    selectAll.addEventListener('change',e=>{visibleRows.forEach(r=>{const id=Number(r.id);e.target.checked?selectedIds.add(id):selectedIds.delete(id)});renderRows()});
    logoutBtn.addEventListener('click',logout);refreshBtn.addEventListener('click',loadMovement);exportBtn.addEventListener('click',exportCsv);combineBtn.addEventListener('click',combineSelected);deleteSelectedBtn.addEventListener('click',deleteSelected);searchBox.addEventListener('input',renderRows);dirFilter.addEventListener('change',renderRows);limitSel.addEventListener('change',loadMovement);cancelEditBtn.addEventListener('click',closeEdit);saveEditBtn.addEventListener('click',saveEdit);editDirection.addEventListener('change',updateEditAfter);editQty.addEventListener('input',updateEditAfter);editBackdrop.addEventListener('click',e=>{if(e.target.id==='editBackdrop')closeEdit()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit()});
    if(requireAdmin())loadMovement();
  </script>
</body>
</html>
